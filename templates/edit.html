{% extends "base.html" %}
{% block title %}Edit Expense — Expense Tracker{% endblock %}
{% block content %}

<h1 class="page-title">Edit Expense</h1>

<div class="form-card">
    <form method="POST">
        <label class="field-label">Expense Name</label>
        <input class="field-input" type="text" name="expense_name" value="{{ expense.expense_name }}">

        <label class="field-label">Amount (₹)</label>
        <input class="field-input" type="text" name="amount" value="{{ expense.amount }}">

        <label class="field-label">Category</label>
        <select class="field-input" name="category">
            {% for c in categories %}
            <option value="{{ c }}" {{ "selected" if c == expense.category }}>{{ c }}</option>
            {% endfor %}
        </select>

        <label class="field-label">Date (YYYY-MM-DD)</label>
        <input class="field-input" type="text" name="date" value="{{ expense.date }}">

        <button class="btn btn-primary" type="submit">Update Expense</button>
        <a class="btn btn-ghost" href="{{ url_for('all_expenses') }}">Cancel</a>
    </form>
</div>

{% endblock %}
